function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('Не удалось прочитать изображение'));
    img.src = url;
  });
}

function waitEvent(el, name, timeout = 12000) {
  return new Promise((resolve, reject) => {
    let done = false;
    const onOk = () => { if (done) return; done = true; cleanup(); resolve(); };
    const onErr = () => { if (done) return; done = true; cleanup(); reject(new Error('Ошибка медиа: ' + name)); };
    const timer = setTimeout(() => onErr(), timeout);
    function cleanup() {
      clearTimeout(timer);
      el.removeEventListener(name, onOk);
      el.removeEventListener('error', onErr);
    }
    el.addEventListener(name, onOk, { once: true });
    el.addEventListener('error', onErr, { once: true });
  });
}

function makeThumbFromSource(src, sw, sh, maxW = 220) {
  try {
    const ratio = sh / sw;
    const w = Math.min(maxW, Math.max(48, sw));
    const hgt = Math.max(1, Math.round(w * ratio));
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = hgt;
    const c = cv.getContext('2d');
    c.drawImage(src, 0, 0, w, hgt);
    return cv.toDataURL('image/jpeg', 0.72);
  } catch (e) {
    return null;
  }
}

/* WebM/MediaRecorder-файлы часто не содержат длительность в метаданных:
   duration === Infinity. Хак — перемотка «в бесконечность» заставляет браузер
   просканировать файл. Делаем это на ОТДЕЛЬНОМ элементе, чтобы не сломать
   декодер основного (иначе элемент навсегда застревает в readyState=1). */
async function probeDurationFromUrl(url, known, type) {
  if (isFinite(known) && known > 0) return known;
  const el = document.createElement(type === 'audio' ? 'audio' : 'video');
  el.preload = 'metadata';
  el.muted = true;
  el.src = url;
  el.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none';
  document.body.appendChild(el);
  let result = 0;
  try {
    await waitEvent(el, 'loadedmetadata', 8000);
    if (isFinite(el.duration) && el.duration > 0) result = el.duration;
    else {
      el.currentTime = 1e101;
      await waitEvent(el, 'seeked', 8000);
      if (isFinite(el.duration) && el.duration > 0) result = el.duration;
    }
  } catch (e) {
    result = 0;
  } finally {
    try { el.removeAttribute('src'); el.load(); } catch (e) {}
    el.remove();
  }
  return result;
}

async function captureVideoThumb(el) {
  try {
    const target = Math.min(0.15, Math.max(0, (el.duration || 1) * 0.1));
    if (Math.abs(el.currentTime - target) > 0.01) {
      el.currentTime = target;
      await waitEvent(el, 'seeked', 6000);
    }
    return makeThumbFromSource(el, el.videoWidth || 320, el.videoHeight || 180);
  } catch (e) {
    return null;
  }
}

/* Импорт файлов: probe → миниатюра → IndexedDB → медиатека */
async function importFiles(files, opts = {}) {
  const list = Array.from(files || []).filter((f) =>
    /^video\//.test(f.type) || /^image\//.test(f.type) || /^audio\//.test(f.type) || /\.(mp4|webm|mov|m4v|mkv|mp3|wav|ogg|m4a|aac|jpg|jpeg|png|webp|gif|avif)$/i.test(f.name)
  );
  if (!list.length) {
    toast('Нужны видео, фото или аудиофайлы', 'warn');
    return [];
  }
  const created = [];
  for (const file of list) {
    try {
      const media = await addMediaFile(file, opts);
      created.push(media);
    } catch (e) {
      console.warn('import failed', file.name, e);
      toast(`Не удалось импортировать «${file.name}»`, 'err');
    }
  }
  if (created.length) {
    refreshPanel();
    refreshTimeline();
    refreshInspector();
    redraw();
    toast(`Добавлено в проект: ${created.length}`, 'ok');
  }
  return created;
}

async function addMediaFile(file, opts = {}) {
  const id = uid('m');
  const isImage = /^image\//.test(file.type) || /\.(jpg|jpeg|png|webp|gif|avif)$/i.test(file.name);
  const isAudio = /^audio\//.test(file.type) || /\.(mp3|wav|ogg|m4a|aac)$/i.test(file.name);
  const type = isImage ? 'image' : isAudio ? 'audio' : 'video';
  const url = URL.createObjectURL(file);
  const media = {
    id, type, url, blob: file,
    name: file.name.replace(/\.[^.]+$/, ''),
    size: file.size,
    duration: 0, width: 0, height: 0, thumb: null,
    el: null, srcNode: null, gains: new Map(),
  };

  if (type === 'image') {
    const img = await loadImage(url);
    media.el = img;
    media.width = img.naturalWidth;
    media.height = img.naturalHeight;
    media.duration = 0;
    media.thumb = makeThumbFromSource(img, img.naturalWidth, img.naturalHeight);
  } else {
    const el = document.createElement(type === 'audio' ? 'audio' : 'video');
    el.src = url;
    el.preload = 'auto';
    el.playsInline = true;
    el.setAttribute('playsinline', '');
    el.volume = 1;
    el.style.cssText = 'position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none';
    document.body.appendChild(el);
    await waitEvent(el, 'loadedmetadata');
    media.el = el;
    media.duration = await probeDurationFromUrl(url, el.duration, type);
    media.width = el.videoWidth || 0;
    media.height = el.videoHeight || 0;
    if (type === 'video') media.thumb = await captureVideoThumb(el);
    if (!media.thumb) media.thumb = audioWavePlaceholderSvg(media.name);
  }

  state.media.set(id, media);
  ensureSource(media);

  /* сохраняем исходник в IndexedDB (чтобы проект восстанавливался) */
  idbPut({
    id, name: media.name, type,
    blob: file,
    duration: media.duration,
    width: media.width,
    height: media.height,
    thumb: media.thumb,
  });

  if (opts.addToTimeline !== false) addMediaToTimeline(media);
  return media;
}

function audioWavePlaceholderSvg(seed) {
  const bars = 24;
  let rects = '';
  let rnd = 0;
  for (let i = 0; i < seed.length; i++) rnd = (rnd * 31 + seed.charCodeAt(i)) % 9973;
  for (let i = 0; i < bars; i++) {
    rnd = (rnd * 1103515245 + 12345) % 2147483648;
    const hgt = 12 + (rnd % 46);
    rects += `<rect x="${i * 8 + 2}" y="${(64 - hgt) / 2}" width="5" height="${hgt}" rx="2.5" fill="#6d8cff" opacity="0.85"/>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="64" viewBox="0 0 200 64"><rect width="200" height="64" fill="#171a24"/>${rects}</svg>`;
  return 'data:image/svg+xml;base64,' + btoa(svg);
}

function defaultDurationFor(media) {
  if (media.type === 'image') return 5;
  return Math.max(0.2, round(media.duration || 5, 2));
}

function addMediaToTimeline(media, targetTrack) {
  pushHistory();
  const track = targetTrack || (media.type === 'audio' ? 'audio' : 'main');
  const duration = defaultDurationFor(media);
  const start = appendStart(track);
  const clip = makeClip({
    track,
    mediaId: media.id,
    start: round(start, 3),
    duration,
    name: media.name,
    speed: 1,
  });
  /* видео на основной дорожке: подгоняем кадр по размеру проекта */
  state.project.clips.push(clip);
  state.selection = clip.id;
  markDirty();
  refreshAll();
  return clip;
}

/* Быстрое добавление с дорожки «Наложение» */
function addMediaAsOverlay(media) {
  const clip = addMediaToTimeline(media, 'overlay');
  const c = findClip(clip.id);
  if (c) {
    c.start = round(state.playhead, 3);
    c.transform = { x: 0.22, y: -0.22, scale: 38, rot: 0 };
    c.duration = Math.min(c.duration, 4);
    markDirty();
    refreshAll();
  }
  return clip;
}

async function removeMedia(id) {
  const media = state.media.get(id);
  if (!media) return;
  const used = state.project.clips.some((c) => c.mediaId === id);
  if (used && !confirm('Файл используется на таймлайне. Удалить вместе с клипами?')) return;
  pushHistory();
  state.project.clips = state.project.clips.filter((c) => c.mediaId !== id);
  if (media.el) {
    try { media.el.pause(); } catch (e) {}
    if (media.type !== 'image') media.el.remove();
  }
  try { URL.revokeObjectURL(media.url); } catch (e) {}
  state.media.delete(id);
  idbDelete(id);
  if (state.selection && !findClip(state.selection)) state.selection = null;
  markDirty();
  refreshAll();
}

/* Восстановление медиа из IndexedDB при загрузке страницы */
async function restoreMediaFromIdb() {
  const rows = await idbAll();
  for (const row of rows) {
    if (state.media.has(row.id)) continue;
    try {
      const url = URL.createObjectURL(row.blob);
      const media = {
        id: row.id, name: row.name, type: row.type, url,
        blob: row.blob,
        duration: row.duration || 0,
        width: row.width || 0,
        height: row.height || 0,
        thumb: row.thumb || null,
        el: null, srcNode: null, gains: new Map(),
      };
      if (media.type === 'image') {
        const img = await loadImage(url);
        media.el = img;
        media.width = media.width || img.naturalWidth;
        media.height = media.height || img.naturalHeight;
        if (!media.thumb) media.thumb = makeThumbFromSource(img, img.naturalWidth, img.naturalHeight);
      } else {
        const el = document.createElement(media.type === 'audio' ? 'audio' : 'video');
        el.src = url;
        el.preload = 'auto';
        el.playsInline = true;
        el.volume = 1;
        el.style.cssText = 'position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none';
        document.body.appendChild(el);
        await waitEvent(el, 'loadedmetadata', 8000);
        media.el = el;
        if (!media.duration) media.duration = await probeDurationFromUrl(url, el.duration, media.type);
        if (!media.thumb && media.type === 'video') media.thumb = await captureVideoThumb(el);
        if (!media.thumb) media.thumb = audioWavePlaceholderSvg(media.name || 'audio');
      }
      state.media.set(media.id, media);
    } catch (e) {
      console.warn('restore media failed', row && row.id, e);
    }
  }
  /* чистим клипы, у которых не восстановился исходник */
  const before = state.project.clips.length;
  state.project.clips = state.project.clips.filter((c) => !c.mediaId || state.media.has(c.mediaId));
  if (state.project.clips.length !== before) {
    console.info('Удалены клипы без исходников:', before - state.project.clips.length);
  }
}

/* ---------- генератор звуковых эффектов (Web Audio → WAV) ---------- */
function encodeWav(buffer) {
  const numCh = buffer.numberOfChannels;
  const len = buffer.length;
  const sr = buffer.sampleRate;
  const bytes = 44 + len * numCh * 2;
  const ab = new ArrayBuffer(bytes);
  const view = new DataView(ab);
  const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
  writeStr(0, 'RIFF'); view.setUint32(4, bytes - 8, true); writeStr(8, 'WAVE');
  writeStr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, numCh, true); view.setUint32(24, sr, true);
  view.setUint32(28, sr * numCh * 2, true); view.setUint16(32, numCh * 2, true);
  view.setUint16(34, 16, true);
  writeStr(36, 'data'); view.setUint32(40, len * numCh * 2, true);
  let off = 44;
  const chans = [];
  for (let c = 0; c < numCh; c++) chans.push(buffer.getChannelData(c));
  for (let i = 0; i < len; i++) {
    for (let c = 0; c < numCh; c++) {
      const s = clamp(chans[c][i], -1, 1);
      view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      off += 2;
    }
  }
  return new Blob([ab], { type: 'audio/wav' });
}

async function renderSfx(kind) {
  const sr = 44100;
  const duration = kind === 'swell' ? 2.4 : kind === 'drop' ? 1.8 : kind === 'whoosh' ? 0.9 : 0.6;
  const OfflineCtx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!OfflineCtx) throw new Error('OfflineAudioContext не поддерживается');
  const ctx = new OfflineCtx(2, Math.floor(sr * duration), sr);

  if (kind === 'tick') {
    for (let i = 0; i < 2; i++) {
      const t0 = 0.02 + i * 0.28;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(i === 0 ? 1800 : 1300, t0);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.5, t0 + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.12);
      osc.connect(g).connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + 0.16);
    }
  } else if (kind === 'swell') {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, 0);
    osc.frequency.exponentialRampToValueAtTime(720, duration);
    g.gain.setValueAtTime(0.0001, 0);
    g.gain.exponentialRampToValueAtTime(0.45, duration * 0.92);
    g.gain.exponentialRampToValueAtTime(0.0001, duration);
    osc.connect(g).connect(ctx.destination);
    osc.start(0); osc.stop(duration);
    const noise = ctx.createBufferSource();
    noise.buffer = makeNoiseBuffer(ctx, duration);
    const nf = ctx.createBiquadFilter();
    nf.type = 'bandpass';
    nf.frequency.setValueAtTime(400, 0);
    nf.frequency.exponentialRampToValueAtTime(4000, duration);
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, 0);
    ng.gain.exponentialRampToValueAtTime(0.18, duration * 0.95);
    ng.gain.exponentialRampToValueAtTime(0.0001, duration);
    noise.connect(nf).connect(ng).connect(ctx.destination);
    noise.start(0);
  } else if (kind === 'drop') {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(140, 0);
    osc.frequency.exponentialRampToValueAtTime(42, duration * 0.75);
    g.gain.setValueAtTime(0.0001, 0);
    g.gain.linearRampToValueAtTime(0.85, 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, duration);
    osc.connect(g).connect(ctx.destination);
    osc.start(0); osc.stop(duration);
  } else {
    /* whoosh */
    const noise = ctx.createBufferSource();
    noise.buffer = makeNoiseBuffer(ctx, duration);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = 1.1;
    bp.frequency.setValueAtTime(260, 0);
    bp.frequency.exponentialRampToValueAtTime(5200, duration * 0.65);
    bp.frequency.exponentialRampToValueAtTime(700, duration);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, 0);
    g.gain.linearRampToValueAtTime(0.5, duration * 0.45);
    g.gain.exponentialRampToValueAtTime(0.0001, duration);
    noise.connect(bp).connect(g).connect(ctx.destination);
    noise.start(0);
  }

  const buf = await ctx.startRendering();
  return encodeWav(buf);
}

let noiseCache = new Map();
function makeNoiseBuffer(ctx, duration) {
  const key = ctx.sampleRate + ':' + duration;
  if (noiseCache.has(key)) return noiseCache.get(key);
  const len = Math.floor(ctx.sampleRate * duration);
  const b = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  noiseCache.set(key, b);
  return b;
}

const SFX_PRESETS = [
  { id: 'whoosh', name: 'Whoosh', desc: 'пролёт' },
  { id: 'swell', name: 'Swell', desc: 'нарастание' },
  { id: 'drop', name: 'Bass drop', desc: 'удар' },
  { id: 'tick', name: 'Tick', desc: 'щелчок' },
];

async function addSfx(kind, name) {
  const blob = await renderSfx(kind);
  const file = new File([blob], `${name || kind}.wav`, { type: 'audio/wav' });
  return addMediaFile(file, { addToTimeline: true });
}

/* ---------- запись голоса ---------- */
let recorder = null;
let recChunks = [];
let recStart = 0;
let recTimer = 0;

async function toggleRecording(btn) {
  if (recorder && recorder.state === 'recording') {
    recorder.stop();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(stream);
    recChunks = [];
    recorder.ondataavailable = (e) => { if (e.data.size) recChunks.push(e.data); };
    recorder.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      clearInterval(recTimer);
      const btnEl = document.getElementById('btnRecord');
      if (btnEl) { btnEl.classList.remove('rec'); btnEl.textContent = 'Записать голос'; }
      if (!recChunks.length) return;
      const blob = new Blob(recChunks, { type: recChunks[0].type || 'audio/webm' });
      const ext = (blob.type.includes('mp4') ? 'm4a' : 'webm');
      const file = new File([blob], `Запись ${new Date().toLocaleTimeString('ru-RU')}.${ext}`, { type: blob.type });
      try {
        await addMediaFile(file, { addToTimeline: true });
        refreshPanel();
        toast('Запись добавлена на таймлайн', 'ok');
      } catch (e) {
        toast('Не удалось добавить запись', 'err');
      }
      recorder = null;
    };
    recorder.start();
    recStart = performance.now();
    const btnEl = document.getElementById('btnRecord');
    if (btnEl) {
      btnEl.classList.add('rec');
      recTimer = setInterval(() => {
        const s = ((performance.now() - recStart) / 1000).toFixed(1);
        btnEl.textContent = `Стоп ${s} с`;
      }, 100);
    }
    toast('Идёт запись с микрофона…', 'info');
  } catch (e) {
    toast('Микрофон недоступен: ' + (e.message || e.name), 'err');
  }
}

/* ===== 04-audio.js ===== */
/* ============================================================
   04 · Звуковой граф: микширование, громкость, фейды, экспорт аудио
   ============================================================ */

let audioCtx = null;
let masterGain = null;
let streamDest = null;

/* AudioContext можно создать только «по жесту» пользователя.
   Пока он suspended, подключать медиаэлементы к графу нельзя:
   иначе браузер приостанавливает воспроизведение самого видео. */
function audioRunning() {
  return !!(audioCtx && audioCtx.state === 'running');
}

function wakeAudio() {
  if (!audioCtx) return;
  if (audioCtx.state === 'running') {
    for (const m of state.media.values()) ensureSource(m);
    return;
  }
  const p = audioCtx.resume();
  if (p && p.then) {
    p.then(() => {
      if (audioRunning()) for (const m of state.media.values()) ensureSource(m);
    }).catch(() => {});
  }
}

function ensureAudio() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try {
    audioCtx = new AC();
  } catch (e) {
    console.warn('AudioContext', e);
    return null;
  }
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 1;
  masterGain.connect(audioCtx.destination);
  if (audioCtx.createMediaStreamDestination) {
    streamDest = audioCtx.createMediaStreamDestination();
    masterGain.connect(streamDest);
  }
  if (audioCtx.state !== 'running') wakeAudio();
  if (audioRunning()) for (const m of state.media.values()) ensureSource(m);
  return audioCtx;
}

function ensureSource(media) {
  if (!audioRunning() || !media || !media.el || media.srcNode) return;
  if (media.type === 'image') return;
  try {
    media.srcNode = audioCtx.createMediaElementSource(media.el);
  } catch (e) {
    /* элемент уже был подключён к другому контексту — игнорируем */
  }
}

function clipGain(media, clipId) {
  if (!audioRunning() || !media) return null;
  ensureSource(media);
  if (!media.srcNode) return null;
  let g = media.gains.get(clipId);
  if (!g) {
    g = audioCtx.createGain();
    g.gain.value = 0;
    media.srcNode.connect(g);
    g.connect(masterGain);
    media.gains.set(clipId, g);
  }
  return g;
}

/* Множитель громкости клипа в момент t (учитывает фейды и mute) */
function gainFactorAt(clip, t) {
  if (clip.muted) return 0;
  const local = t - clip.start;
  if (local < -0.05 || local > clip.duration + 0.05) return 0;
  let f = 1;
  if (clip.fadeIn > 0 && local < clip.fadeIn) f = Math.max(0, local / clip.fadeIn);
  if (clip.fadeOut > 0 && local > clip.duration - clip.fadeOut) {
    f = Math.min(f, Math.max(0, (clip.duration - local) / clip.fadeOut));
  }
  return clamp(f, 0, 1);
}

function updateAudioGains(t) {
  if (!audioRunning() || !masterGain) return;
  masterGain.gain.setTargetAtTime(state.masterVolume, audioCtx.currentTime, 0.02);
  for (const clip of state.project.clips) {
    const media = state.media.get(clip.mediaId);
    if (!media || media.type === 'image') continue;
    const g = clipGain(media, clip.id);
    if (!g) continue;
    const target = clamp(clip.volume, 0, 2) * gainFactorAt(clip, t);
    g.gain.setTargetAtTime(target, audioCtx.currentTime, 0.015);
  }
  /* освобождаем гейны удалённых клипов */
  for (const media of state.media.values()) {
    if (!media.gains) continue;
    for (const [clipId, g] of media.gains) {
      if (!findClip(clipId)) {
        try { g.disconnect(); media.srcNode && media.srcNode.disconnect(g); } catch (e) {}
        media.gains.delete(clipId);
      }
    }
  }
}

function silenceAll() {
  if (!audioCtx) return;
  for (const media of state.media.values()) {
    if (!media.gains) continue;
    for (const g of media.gains.values()) {
      try { g.gain.setTargetAtTime(0, audioCtx.currentTime, 0.01); } catch (e) {}
    }
  }
}

function muteMediaElements(muted) {
  for (const media of state.media.values()) {
    if (!media.el || media.type === 'image') continue;
    try { media.el.muted = muted; } catch (e) {}
  }
}

/* ===== 05-render.js ===== */
/* ============================================================
   05 · Рендерер кадра: композитинг, фильтры, переходы, текст
   ============================================================ */

let drawCanvas = null;
let drawCtx = null;

function initRenderer() {
  drawCanvas = document.getElementById('preview');
  if (drawCanvas) drawCtx = drawCanvas.getContext('2d', { alpha: false });
}

function fontStack(id) {
  const f = FONTS.find((x) => x.id === id) || FONTS[0];
  return f.stack;
}

function filterString(clip) {
  const preset = FILTERS.find((f) => f.id === clip.filter);
  const parts = [];
  if (preset && preset.css) parts.push(preset.css);
  const a = clip.adj || { b: 100, c: 100, s: 100 };
  if (a.b !== 100) parts.push(`brightness(${a.b / 100})`);
  if (a.c !== 100) parts.push(`contrast(${a.c / 100})`);
  if (a.s !== 100) parts.push(`saturate(${a.s / 100})`);
  return parts.length ? parts.join(' ') : 'none';
}

function opacityAt(clip, t) {
  const base = (clip.opacity == null ? 100 : clip.opacity) / 100;
  const local = t - clip.start;
  let f = 1;
  if (clip.fadeIn > 0 && local < clip.fadeIn) f = Math.max(0, local / clip.fadeIn);
  if (clip.fadeOut > 0 && local > clip.duration - clip.fadeOut) {
    f = Math.min(f, Math.max(0, (clip.duration - local) / clip.fadeOut));
  }
  return clamp(base * f, 0, 1);
}

function clipIsActive(clip, t, pad = 0) {
  return t >= clip.start - pad && t < clip.start + clip.duration + pad;
}

/* Перевод «время таймлайна» → «время исходника» */
function sourceTimeAt(clip, t) {
  return clip.inPoint + clamp(t - clip.start, 0, clip.duration) * clip.speed;
}

/* В режиме реального времени мы не можем «заморозить» видео,
   поэтому кадр берётся у самого элемента; синхронизацией занимается syncMedia(). */

function drawMediaFit(ctx, srcEl, sw, sh, transform, W, H) {
  if (!sw || !sh) { sw = srcEl.videoWidth || srcEl.width || W; sh = srcEl.videoHeight || srcEl.height || H; }
  const cover = Math.max(W / sw, H / sh);
  const tr = transform || { x: 0, y: 0, scale: 100, rot: 0 };
  const scale = cover * ((tr.scale == null ? 100 : tr.scale) / 100);
  const dw = sw * scale;
  const dh = sh * scale;
  const cx = W / 2 + (tr.x || 0) * W;
  const cy = H / 2 + (tr.y || 0) * H;
  ctx.save();
  ctx.translate(cx, cy);
  if (tr.rot) ctx.rotate((tr.rot * Math.PI) / 180);
  ctx.drawImage(srcEl, -dw / 2, -dh / 2, dw, dh);
  ctx.restore();
  return { dw, dh };
}

function drawClipVisual(clip, t, alpha, extraOffsetX = 0) {
  const media = state.media.get(clip.mediaId);
  if (!media) return false;
  const W = state.project.width;
  const H = state.project.height;
  const ctx = drawCtx;

  let srcEl = media.el;
  if (media.type !== 'image') {
    if (!srcEl || srcEl.readyState < 2) return false;
  } else if (!srcEl || !srcEl.complete) return false;

  ctx.save();
  ctx.globalAlpha = clamp(alpha, 0, 1);
  const fs = filterString(clip);
  if (fs !== 'none') ctx.filter = fs;
  const tr = Object.assign({}, clip.transform);
  if (extraOffsetX) tr.x = (tr.x || 0) + extraOffsetX;
  drawMediaFit(ctx, srcEl, media.width, media.height, tr, W, H);
  ctx.restore();
  return true;
}

/* ---------- текст ---------- */

function wrapLines(ctx, text, maxWidth) {
  const out = [];
  const paragraphs = String(text).split('\n');
  for (const para of paragraphs) {
    const words = para.split(' ');
    let line = '';
    for (const word of words) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        out.push(line);
        line = word;
      } else {
        line = test;
      }
    }
    out.push(line);
  }
  return out;
}

function textFontCss(tx) {
  return `${tx.weight || 700} ${Math.max(4, tx.size || 72)}px ${fontStack(tx.font)}`;
}

function drawTextClip(clip, t, alpha) {
  const tx = clip.text;
  if (!tx) return;
  const W = state.project.width;
  const H = state.project.height;
  const ctx = drawCtx;
  const k = H / 1080; /* масштаб относительно 1080p */
  const fontSize = Math.max(8, tx.size * k);
  const font = `${tx.weight || 700} ${fontSize}px ${fontStack(tx.font)}`;

  ctx.save();
  ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.font = font;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  if (tx.letter) {
    /* межбуквенное расстояние поддерживается не везде — рисуем вручную */
    ctx.letterSpacing = `${tx.letter}em`;
  }
  const maxWidth = W * 0.9;
  const lines = wrapLines(ctx, tx.content || '', maxWidth);
  const lineH = fontSize * (tx.lineH || 1.22);
  const totalH = lineH * lines.length;
  const cx = (tx.x == null ? 0.5 : tx.x) * W;
  const cyTop = (tx.y == null ? 0.5 : tx.y) * H - totalH / 2 + lineH / 2;

  /* фон-плашка за весь блок */
  if (tx.bgOpacity > 0) {
    let wMax = 0;
    for (const l of lines) wMax = Math.max(wMax, ctx.measureText(l).width);
    const padX = fontSize * 0.34;
    const padY = fontSize * 0.22;
    ctx.save();
    ctx.globalAlpha = clamp(alpha, 0, 1) * clamp(tx.bgOpacity, 0, 1);
    ctx.fillStyle = tx.bgColor || '#000000';
    const rx = Math.min(fontSize * 0.3, 24 * k);
    const bw = wMax + padX * 2;
    const bh = totalH + padY * 2;
    roundRect(ctx, cx - bw / 2, cyTop - lineH / 2 - padY, bw, bh, rx);
    ctx.fill();
    ctx.restore();
  }

  for (let i = 0; i < lines.length; i++) {
    const ly = cyTop + i * lineH;
    if (tx.shadow) {
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.65)';
      ctx.shadowBlur = fontSize * 0.45;
      ctx.shadowOffsetY = fontSize * 0.08;
      ctx.fillStyle = tx.color || '#fff';
      ctx.fillText(lines[i], cx, ly);
      ctx.restore();
      /* неоновое свечение */
      ctx.save();
      ctx.globalAlpha = clamp(alpha, 0, 1) * 0.6;
      ctx.shadowColor = tx.color || '#fff';
      ctx.shadowBlur = fontSize * 0.8;
      ctx.fillStyle = tx.color || '#fff';
      ctx.fillText(lines[i], cx, ly);
      ctx.restore();
    }
    if (tx.strokeW > 0) {
      ctx.lineWidth = tx.strokeW * k;
      ctx.strokeStyle = tx.stroke || '#000';
      ctx.lineJoin = 'round';
      ctx.strokeText(lines[i], cx, ly);
    }
    ctx.fillStyle = tx.color || '#ffffff';
    ctx.fillText(lines[i], cx, ly);
  }
  ctx.restore();
}

function roundRect(ctx, x, y, w, hgt, r) {
  const rr = Math.min(r, w / 2, hgt / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + hgt, rr);
  ctx.arcTo(x + w, y + hgt, x, y + hgt, rr);
  ctx.arcTo(x, y + hgt, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

/* ---------- отрисовка дорожки ---------- */

function activeClipsOn(track, t) {
  return clipsOf(track)
    .filter((c) => clipIsActive(c, t))
    .sort((a, b) => a.start - b.start);
}

function drawTrack(track, t) {
  const clips = clipsOf(track).sort((a, b) => a.start - b.start);
  for (const clip of clips) {
    if (!clipIsActive(clip, t)) continue;
    const tr = clip.transition || { type: 'none', dur: 0 };
    const prev = prevClipOf(track, clip);
    const inTransition = tr.dur > 0 && prev && t < clip.start + tr.dur;

    if (inTransition) {
      const p = clamp((t - clip.start) / tr.dur, 0, 1);
      const eased = p * p * (3 - 2 * p);
      /* исходящий кадр предыдущего клипа */
      const prevFrameTime = Math.min(prev.start + prev.duration - 0.001, t);
      if (tr.type === 'fadeblack') {
        drawClipVisual(prev, prevFrameTime, 1 - eased);
        /* чёрный между — оставляем как есть, экран уже чёрный */
      } else if (tr.type === 'slide') {
        drawClipVisual(prev, prevFrameTime, 1);
        drawClipVisual(clip, t, 1, -(1 - eased) * 1.05);
      } else if (tr.type === 'zoom') {
        drawClipVisual(prev, prevFrameTime, 1 - eased);
        const media = state.media.get(clip.mediaId);
        if (media) {
          const saved = JSON.parse(JSON.stringify(clip.transform || {}));
          clip.transform = Object.assign({}, clip.transform, {
            scale: (clip.transform.scale || 100) * (1.18 - 0.18 * eased),
          });
          drawClipVisual(clip, t, eased);
          clip.transform = saved;
        } else {
          drawClipVisual(clip, t, eased);
        }
      } else {
        /* crossfade */
        drawClipVisual(prev, prevFrameTime, 1);
        drawClipVisual(clip, t, eased);
      }
    } else {
      const alpha = opacityAt(clip, t);
      if (clip.track === 'text') drawTextClip(clip, t, alpha);
      else drawClipVisual(clip, t, alpha);
    }
  }
}

function drawFrame(t) {
  if (!drawCtx) return;
  const W = state.project.width;
  const H = state.project.height;
  if (drawCanvas.width !== W || drawCanvas.height !== H) {
    drawCanvas.width = W;
    drawCanvas.height = H;
  }
  drawCtx.setTransform(1, 0, 0, 1, 0, 0);
  drawCtx.globalAlpha = 1;
  drawCtx.filter = 'none';
  drawCtx.fillStyle = '#000000';
  drawCtx.fillRect(0, 0, W, H);
  drawTrack('main', t);
  drawTrack('overlay', t);
  drawTrack('text', t);
  /* безопасные поля */
  if (state.showSafe) {
    drawCtx.save();
    drawCtx.strokeStyle = 'rgba(255,255,255,.25)';
    drawCtx.lineWidth = 2;
    drawCtx.strokeRect(W * 0.05, H * 0.05, W * 0.9, H * 0.9);
    drawCtx.restore();
  }
  state.needsDraw = false;
}

/* ---------- попадание по тексту на канвасе ---------- */

function hitTestText(nx, ny) {
  const t = state.playhead;
  const list = clipsOf('text').filter((c) => clipIsActive(c, t));
  for (let i = list.length - 1; i >= 0; i--) {
    const c = list[i];
    const tx = c.text;
    if (!tx) continue;
    const box = textBoxOf(c);
    if (nx >= box.x0 && nx <= box.x1 && ny >= box.y0 && ny <= box.y1) return c;
  }
  return null;
}

/* Приблизительные габариты текстового блока в долях кадра */
function textBoxOf(clip) {
  const tx = clip.text || {};
  const W = state.project.width;
  const H = state.project.height;
  const k = H / 1080;
  const fontSize = Math.max(8, (tx.size || 72) * k);
  const lines = String(tx.content || '').split('\n');
  const approxW = Math.min(W * 0.9, Math.max(...lines.map((l) => l.length * fontSize * 0.55), fontSize));
  const approxH = fontSize * (tx.lineH || 1.22) * lines.length;
  const cx = (tx.x == null ? 0.5 : tx.x) * W;
  const cy = (tx.y == null ? 0.5 : tx.y) * H;
  return {
    x0: cx - approxW / 2, x1: cx + approxW / 2,
    y0: cy - approxH / 2, y1: cy + approxH / 2,
    cx, cy,
  };
}

/* ===== 06-playback.js ===== */
/* ============================================================
   06 · Движок воспроизведения и синхронизация медиаэлементов
   ============================================================ */

state.lastTick = 0;
state.onEnded = null;

function nextClipOf(track, clip) {
  const list = clipsOfTrackSorted(track, clip.id);
  for (const c of list) {
    if (c.start >= clip.start + clip.duration - 1e-6) return c;
  }
  return null;
}

function hookMedia(media) {
  if (!media.el || media._hooked || media.type === 'image') return;
  media._hooked = true;
  const bump = () => { state.needsDraw = true; };
  media.el.addEventListener('seeked', bump);
  media.el.addEventListener('loadeddata', bump);
  media.el.addEventListener('timeupdate', bump);
  media.el.addEventListener('ended', () => { state.needsDraw = true; });
}

function clipNeedsMedia(clip, t) {
  if (clipIsActive(clip, t, 0.06)) return true;
  if (clip.track === 'main' || clip.track === 'overlay') {
    const next = nextClipOf(clip.track, clip);
    if (next && next.transition && next.transition.dur > 0) {
      const until = next.start + next.transition.dur;
      if (t >= clip.start + clip.duration - 0.06 && t < until) return true;
    }
  }
  return false;
}

function syncMedia(t) {
  /* Один медиаэлемент может использоваться несколькими клипами
     (например, после разрезания). Драйвер у каждого элемента должен быть
     ровно один, иначе currentTime «пинг-понгует» и декодер застревает. */
  for (const media of state.media.values()) {
    if (!media.el || media.type === 'image') continue;
    hookMedia(media);

    const clips = state.project.clips.filter((c) => c.mediaId === media.id);
    if (!clips.length) {
      if (!media.el.paused) media.el.pause();
      continue;
    }

    const needing = clips.filter((c) => clipNeedsMedia(c, t));
    if (!needing.length) {
      if (!media.el.paused) media.el.pause();
      continue;
    }

    /* приоритет — клип, который сейчас реально в кадре */
    const active = needing.find((c) => clipIsActive(c, t, 0.06));
    const primary = active || needing[0];
    const el = media.el;
    const maxTime = Math.max(0, (media.duration || 0) - 0.03);
    const desired = clamp(sourceTimeAt(primary, t), 0, maxTime || 1e6);
    const speed = clamp(primary.speed || 1, 0.1, 8);

    if (state.playing) {
      if (Math.abs(el.playbackRate - speed) > 0.001) el.playbackRate = speed;
      if (el.paused) {
        try { el.currentTime = desired; } catch (e) {}
        const p = el.play();
        if (p && p.catch) p.catch(() => {});
      } else if (!el.seeking && Math.abs(el.currentTime - desired) > 0.3) {
        try { el.currentTime = desired; } catch (e) {}
      }
    } else {
      if (!el.paused) el.pause();
      const tol = 1.5 / (state.project.fps || 30);
      if (!el.seeking && Math.abs(el.currentTime - desired) > tol) {
        try { el.currentTime = desired; } catch (e) {}
      }
    }
  }
}

function pauseAllMedia() {
  for (const media of state.media.values()) {
    if (media.el && media.type !== 'image') {
      try { media.el.pause(); } catch (e) {}
    }
  }
}

function play() {
  if (state.playing) return;
  if (projectDuration() <= 0.01) {
    toast('Сначала добавьте видео, фото или текст на таймлайн', 'warn');
    return;
  }
  ensureAudio();
  if (state.playhead >= projectDuration() - 0.02) state.playhead = 0;
  state.playing = true;
  state.lastTick = performance.now();
  refreshTransport();
}

function pause() {
  if (!state.playing) return;
  state.playing = false;
  state.lastTick = 0;
  pauseAllMedia();
  refreshTransport();
}

function stopPlayback() {
  state.playing = false;
  pauseAllMedia();
  refreshTransport();
}

function togglePlay() {
  if (state.playing) pause();
  else play();
}

function seek(t, opts = {}) {
  const dur = Math.max(projectDuration(), opts.minDuration || 0);
  state.playhead = clamp(t, 0, Math.max(0, dur));
  state.lastTick = performance.now();
  state.needsDraw = true;
  updatePlayheadUI();
  refreshTransport(true);
}

function stepFrame(dir) {
  pause();
  const step = 1 / (state.project.fps || 30);
  seek(state.playhead + dir * step);
}

function tickLoop(now) {
  if (state.playing) {
    const dt = Math.min(0.2, (now - (state.lastTick || now)) / 1000);
    state.lastTick = now;
    const dur = projectDuration();
    state.playhead += dt;
    if (state.playhead >= dur) {
      state.playhead = dur;
      pause();
      const cb = state.onEnded;
      state.onEnded = null;
      if (cb) cb();
    }
  }
  syncMedia(state.playhead);
  updateAudioGains(state.playhead);
  if (state.playing || state.needsDraw) drawFrame(state.playhead);
  updatePlayheadUI();
  updateStageHud();
  requestAnimationFrame(tickLoop);
}

/* ---------- UI транспорта ---------- */

function refreshTransport(onlyTime) {
  const btn = $('#btnPlay');
  if (btn) {
    btn.innerHTML = '';
    btn.appendChild(icon(state.playing ? 'pause' : 'play', 20));
    btn.classList.toggle('playing', state.playing);
    btn.setAttribute('aria-label', state.playing ? 'Пауза' : 'Воспроизвести');
  }
  if (!onlyTime) {
    $$('#aspectSeg button').forEach((b) => b.classList.toggle('on', b.dataset.aspect === state.project.aspect));
  }
  updateTimeLabel();
}

function updateTimeLabel() {
  const n = $('#timeLabel');
  if (!n) return;
  const dur = projectDuration();
  n.textContent = `${fmtTime(state.playhead, state.project.fps)} / ${fmtTime(dur, state.project.fps)}`;
}

function updateStageHud() {
  const hud = $('#stageHud');
  if (!hud) return;
  const clip = selectedClip();
  let txt = '';
  if (clip) {
    const media = state.media.get(clip.mediaId);
    txt = media ? media.name : clip.track === 'text' ? 'Текст: ' + (clip.text ? clip.text.content.slice(0, 22) : '') : '';
  }
  if (hud.textContent !== txt) hud.textContent = txt;
}

/* ===== 07-timeline.js ===== */
/* ============================================================
   07 · Таймлайн: дорожки, клипы, перетаскивание, обрезка, зум
   ============================================================ */

const tl = {
  labels: null,
  scroll: null,
  inner: null,
  ruler: null,
  tracks: null,
  playhead: null,
  built: false,
};

function buildTimelineShell() {
  tl.labels = $('#tlLabels');
  tl.scroll = $('#tlScroll');
  tl.inner = $('#tlInner');
  tl.ruler = $('#tlRuler');
  tl.tracks = $('#tlTracks');
  tl.playhead = $('#tlPlayhead');
  tl.built = true;

  tl.labels.innerHTML = '';
  for (const t of TRACKS) {
    tl.labels.appendChild(
      h('div', { class: 'tl-label', style: { height: t.height + 'px' } },
        h('span', { class: 'tl-label-name' }, t.name),
        h('span', { class: 'tl-label-dot ' + t.kind })
      )
    );
  }

  tl.tracks.innerHTML = '';
  tl.ruler.innerHTML = '';
  for (const t of TRACKS) {
    tl.tracks.appendChild(
      h('div', {
        class: 'tl-track',
        dataset: { track: t.id },
        style: { height: t.height + 'px' },
        onpointerdown: (e) => {
          if (e.target === e.currentTarget) {
            state.selection = null;
            refreshInspector();
            refreshTimeline();
            scrubFromEvent(e, true);
          }
        },
      })
    );
  }

  /* клик/драг по линейке = скраб */
  tl.ruler.addEventListener('pointerdown', (e) => scrubFromEvent(e, true));

  /* колесо мыши + ctrl = зум */
  tl.scroll.addEventListener('wheel', (e) => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      setZoom(state.pxPerSec * (e.deltaY > 0 ? 0.9 : 1.1));
    }
  }, { passive: false });
}

function scrubFromEvent(e, drag) {
  const rect = tl.inner.getBoundingClientRect();
  const apply = (clientX) => {
    const x = clientX - rect.left;
    seek(Math.max(0, x / state.pxPerSec));
  };
  apply(e.clientX);
  if (!drag) return;
  const move = (ev) => apply(ev.clientX);
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
}

function setZoom(pps) {
  state.pxPerSec = clamp(pps, 12, 400);
  const inp = $('#tlZoom');
  if (inp) inp.value = String(Math.round(state.pxPerSec));
  refreshTimeline();
  updatePlayheadUI();
}

function fitTimeline() {
  const dur = Math.max(projectDuration(), 4);
  const w = tl.scroll ? tl.scroll.clientWidth - 32 : 800;
  setZoom(w / dur);
  if (tl.scroll) tl.scroll.scrollLeft = 0;
}

function tickStep() {
  const cands = [0.1, 0.2, 0.25, 0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600];
  for (const c of cands) {
    if (c * state.pxPerSec >= 64) return c;
  }
  return 900;
}

function renderRuler(dur) {
  if (!tl.ruler) return;
  tl.ruler.innerHTML = '';
  const step = tickStep();
  const total = Math.max(dur + 12, 40);
  const frag = document.createDocumentFragment();
  for (let t = 0; t <= total; t += step) {
    const left = t * state.pxPerSec;
    if (left > total * state.pxPerSec) break;
    frag.appendChild(
      h('div', { class: 'tick', style: { left: left + 'px' } },
        h('span', {}, fmtTime(t, state.project.fps).slice(0, 5))
      )
    );
  }
  tl.ruler.appendChild(frag);
}

function clipLabel(clip) {
  if (clip.track === 'text') return (clip.text && clip.text.content) || 'Текст';
  if (clip.mediaId) {
    const m = state.media.get(clip.mediaId);
    return m ? m.name : 'Файл';
  }
  return clip.name || 'Клип';
}

function clipClass(clip) {
  const media = state.media.get(clip.mediaId);
  const kinds = [];
  kinds.push('t-' + clip.track);
  if (media) kinds.push('k-' + media.type);
  if (state.selection === clip.id) kinds.push('sel');
  if (clip.transition && clip.transition.dur > 0 && clip.transition.type !== 'none') kinds.push('has-trans');
  return kinds.join(' ');
}

function buildClipNode(clip) {
  const pps = state.pxPerSec;
  const w = Math.max(8, clip.duration * pps);
  const node = h('div', {
    class: 'clip ' + clipClass(clip),
    dataset: { id: clip.id },
    style: { left: clip.start * pps + 'px', width: w + 'px' },
    title: `${clipLabel(clip)} · ${fmtDur(clip.duration)}`,
  });

  const media = state.media.get(clip.mediaId);
  if (media && media.thumb && clip.track !== 'text' && clip.track !== 'audio') {
    const strip = h('div', { class: 'clip-strip' });
    strip.style.backgroundImage = `url(${media.thumb})`;
    strip.style.backgroundSize = `auto ${Math.max(24, TRACKS.find((t) => t.id === clip.track).height - 18)}px`;
    node.appendChild(strip);
  }
  if (clip.track === 'audio') {
    node.appendChild(h('div', { class: 'clip-wave' }));
  }
  if (clip.track === 'text') {
    node.appendChild(h('div', { class: 'clip-text-badge' }, 'T'));
  }

  node.appendChild(h('div', { class: 'clip-title' }, clipLabel(clip)));
  if (clip.speed !== 1) node.appendChild(h('div', { class: 'clip-badge' }, clip.speed.toFixed(2).replace(/\.?0+$/, '') + '×'));
  if (clip.muted) node.appendChild(h('div', { class: 'clip-badge mute' }, 'M'));

  if (w > 30) {
    node.appendChild(h('div', { class: 'handle l', dataset: { mode: 'trim-l' } }));
    node.appendChild(h('div', { class: 'handle r', dataset: { mode: 'trim-r' } }));
  }

  node.addEventListener('pointerdown', (e) => startClipDrag(e, clip, node));
  node.addEventListener('dblclick', (e) => {
    e.stopPropagation();
    if (clip.track === 'text') {
      setTab('text');
      setTimeout(() => {
        const ta = $('#textContentInput');
        if (ta) { ta.focus(); ta.select(); }
      }, 60);
    }
  });
  return node;
}

function renderTimeline() {
  if (!tl.built) return;
  const dur = Math.max(projectDuration(), 12);
  const pps = state.pxPerSec;
  const innerW = Math.max(dur * pps + 260, (tl.scroll ? tl.scroll.clientWidth : 900));
  tl.inner.style.width = innerW + 'px';

  renderRuler(dur);

  for (const t of TRACKS) {
    const row = tl.tracks.querySelector(`.tl-track[data-track="${t.id}"]`);
    if (!row) continue;
    row.innerHTML = '';
    const clips = clipsOf(t.id).sort((a, b) => a.start - b.start);
    for (const c of clips) row.appendChild(buildClipNode(c));
  }

  const durNode = $('#tlDur');
  if (durNode) durNode.textContent = `Длительность: ${fmtTime(projectDuration(), state.project.fps)}`;
  updatePlayheadUI();
  const countNode = $('#tlCount');
  if (countNode) countNode.textContent = `${state.project.clips.length} клип(ов)`;
}

function updatePlayheadUI() {
  if (!tl.playhead) return;
  const x = state.playhead * state.pxPerSec;
  tl.playhead.style.transform = `translateX(${x}px)`;
  const handle = $('#tlPlayheadCap');
  if (handle) handle.style.transform = `translateX(${x}px)`;
  updateTimeLabel();
  /* автоскролл при воспроизведении */
  if (state.playing && tl.scroll) {
    const left = tl.scroll.scrollLeft;
    const w = tl.scroll.clientWidth;
    if (x < left + 40 || x > left + w - 80) {
      tl.scroll.scrollLeft = Math.max(0, x - w * 0.35);
    }
  }
}

/* ---------- перетаскивание и обрезка ---------- */

const SNAP_PX = 8;

function snapPoints(excludeId) {
  const pts = [0, state.playhead];
  for (const c of state.project.clips) {
    if (c.id === excludeId) continue;
    pts.push(c.start, c.start + c.duration);
  }
  return pts;
}

function applySnap(value, pts, pps) {
  let best = value;
  let bestDist = SNAP_PX / pps;
  for (const p of pts) {
    const d = Math.abs(p - value);
    if (d < bestDist) { bestDist = d; best = p; }
  }
  return round(best, 3);
}

function trackAtPoint(clientX, clientY) {
  const el = document.elementFromPoint(clientX, clientY);
  if (!el) return null;
  const row = el.closest ? el.closest('.tl-track') : null;
  return row ? row.dataset.track : null;
}

function canGoToTrack(clip, trackId) {
  if (trackId === clip.track) return true;
  const media = state.media.get(clip.mediaId);
  if (clip.track === 'text') return trackId === 'text';
  if (media && media.type === 'audio') return trackId === 'audio';
  return trackId === 'main' || trackId === 'overlay';
}

function maxDurationFor(clip) {
  const media = state.media.get(clip.mediaId);
  if (!media || media.type === 'image' || !media.duration) return 3600;
  return Math.max(0.2, (media.duration - clip.inPoint) / (clip.speed || 1));
}

function startClipDrag(e, clip, node) {
  if (e.button !== 0) return;
  e.stopPropagation();
  e.preventDefault();

  const mode = e.target.dataset && e.target.dataset.mode ? e.target.dataset.mode : 'move';
  state.selection = clip.id;
  $$('.clip.sel').forEach((n) => n.classList.remove('sel'));
  node.classList.add('sel');
  refreshInspector();
  refreshTimelineLight();

  const pps = state.pxPerSec;
  const startX = e.clientX;
  const startY = e.clientY;
  const orig = { start: clip.start, duration: clip.duration, inPoint: clip.inPoint, track: clip.track };
  let snapPts = snapPoints(clip.id);
  let moved = false;
  let historyPushed = false;

  const guide = $('#snapGuide');

  const onMove = (ev) => {
    const dx = (ev.clientX - startX) / pps;
    if (!moved && Math.abs(ev.clientX - startX) < 2 && Math.abs(ev.clientY - startY) < 2) return;
    if (!moved) {
      moved = true;
      if (!historyPushed) { pushHistory(); historyPushed = true; }
      document.body.classList.add('dragging-clip');
      snapPts = snapPoints(clip.id);
    }

    if (mode === 'move') {
      let ns = orig.start + dx;
      const snapped = applySnap(ns, snapPts, pps);
      if (snapped !== ns) { ns = snapped; showSnapGuide(ns); } else hideSnapGuide();
      clip.start = round(Math.max(0, ns), 3);
      /* смена дорожки */
      const hoverTrack = trackAtPoint(ev.clientX, ev.clientY);
      if (hoverTrack && hoverTrack !== clip.track && canGoToTrack(clip, hoverTrack)) {
        clip.track = hoverTrack;
        renderTimeline();
        node = tl.tracks.querySelector(`.clip[data-id="${clip.id}"]`) || node;
      }
      node.style.left = clip.start * pps + 'px';
    } else if (mode === 'trim-l') {
      let delta = dx;
      /* нельзя выйти за начало исходника */
      const media = state.media.get(clip.mediaId);
      if (media && media.duration) {
        const minDelta = -orig.inPoint / (clip.speed || 1);
        delta = Math.max(delta, minDelta);
      }
      delta = Math.min(delta, orig.duration - 0.15);
      let newStart = orig.start + delta;
      const snapped = applySnap(newStart, snapPts, pps);
      if (snapped !== newStart) { delta += snapped - newStart; newStart = snapped; showSnapGuide(newStart); } else hideSnapGuide();
      if (newStart < 0) { delta -= newStart; newStart = 0; }
      clip.start = round(newStart, 3);
      clip.duration = round(Math.max(0.15, orig.duration - delta), 3);
      clip.inPoint = round(Math.max(0, orig.inPoint + delta * (clip.speed || 1)), 3);
      node.style.left = clip.start * pps + 'px';
      node.style.width = Math.max(8, clip.duration * pps) + 'px';
    } else {
      const media = state.media.get(clip.mediaId);
      let maxDur = 3600;
      if (media && media.duration) maxDur = Math.max(0.15, (media.duration - orig.inPoint) / (clip.speed || 1));
      let newEnd = orig.start + orig.duration + dx;
      const snapped = applySnap(newEnd, snapPts, pps);
      if (snapped !== newEnd) { newEnd = snapped; showSnapGuide(newEnd); } else hideSnapGuide();
      const newDur = clamp(newEnd - orig.start, 0.15, maxDur);
      clip.duration = round(newDur, 3);
      node.style.width = Math.max(8, clip.duration * pps) + 'px';
    }

    markDirty();
    refreshTimelineLight();
    updateTimeLabel();
    redraw();
  };

  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    document.body.classList.remove('dragging-clip');
    hideSnapGuide();
    if (moved) {
      refreshTimeline();
      refreshInspector();
      refreshPanel();
      redraw();
    }
  };

  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
}

function showSnapGuide(t) {
  const g = $('#snapGuide');
  if (!g) return;
  g.style.display = 'block';
  g.style.transform = `translateX(${t * state.pxPerSec}px)`;
}

function hideSnapGuide() {
  const g = $('#snapGuide');
  if (g) g.style.display = 'none';
}

/* Обновление только выделения/подписей без пересборки DOM */
function refreshTimelineLight() {
  if (!tl.built) return;
  $$('.tl-track .clip').forEach((n) => {
    n.classList.toggle('sel', n.dataset.id === state.selection);
  });
}

const TABS = [
  { id: 'media', name: 'Медиа', icon: 'image' },
  { id: 'text', name: 'Текст', icon: 'text' },
  { id: 'filters', name: 'Фильтры', icon: 'filter' },
  { id: 'transitions', name: 'Переходы', icon: 'transition' },
  { id: 'audio', name: 'Аудио', icon: 'audio' },
];

function buildTabs() {
  const nav = $('#tabs');
  if (!nav) return;
  nav.innerHTML = '';
  for (const t of TABS) {
    nav.appendChild(
      h('button', {
        class: 'tab' + (state.activeTab === t.id ? ' on' : ''),
        dataset: { tab: t.id },
        title: t.name,
        onclick: () => setTab(t.id),
      }, icon(t.icon, 18), h('span', {}, t.name))
    );
  }
}

function setTab(id) {
  state.activeTab = id;
  $$('#tabs .tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === id));
  refreshPanel();
}

function refreshPanel() {
  const body = $('#panelBody');
  if (!body) return;
  const scrollTop = body.scrollTop;
  body.innerHTML = '';
  const fn = {
    media: renderMediaPanel,
    text: renderTextPanel,
    filters: renderFiltersPanel,
    transitions: renderTransitionsPanel,
    audio: renderAudioPanel,
  }[state.activeTab] || renderMediaPanel;
  fn(body);
  body.scrollTop = scrollTop;
}

/* ---------- МЕДИА ---------- */

function renderMediaPanel(root) {
  root.appendChild(
    h('div', { class: 'panel-head' },
      h('h3', {}, 'Медиатека'),
      h('button', { class: 'btn primary sm', onclick: () => $('#fileInput').click() },
        icon('upload', 15), 'Импорт')
    )
  );

  const list = Array.from(state.media.values());
  const drop = h('div', { class: 'dropzone' },
    icon('upload', 22),
    h('div', {}, 'Нажмите или перетащите файлы сюда'),
    h('small', {}, 'MP4 · WebM · MOV · MP3 · WAV · JPG · PNG')
  );
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', (e) => {
    e.preventDefault();
    drop.classList.remove('over');
    if (e.dataTransfer.files && e.dataTransfer.files.length) importFiles(e.dataTransfer.files);
  });
  drop.addEventListener('click', () => $('#fileInput').click());
  root.appendChild(drop);

  if (!list.length) {
    root.appendChild(h('p', { class: 'hint' }, 'Пока пусто. Импортируйте видео — оно автоматически встанет на основную дорожку.'));
    return;
  }

  const grid = h('div', { class: 'media-grid' });
  for (const m of list) {
    const card = h('div', { class: 'media-card', title: m.name + ' · ' + fmtDur(m.duration || 0) },
      h('div', { class: 'media-thumb' },
        m.thumb ? h('img', { src: m.thumb, alt: m.name, loading: 'lazy' }) : h('div', { class: 'media-noimg' }, icon(m.type === 'audio' ? 'audio' : 'video', 20)),
        h('span', { class: 'media-dur' }, m.type === 'image' ? 'фото' : fmtDur(m.duration || 0)),
        h('div', { class: 'media-actions' },
          h('button', { class: 'mini', title: 'На основную дорожку', onclick: (e) => { e.stopPropagation(); addMediaToTimeline(m, m.type === 'audio' ? 'audio' : 'main'); } }, icon('plus', 14)),
          m.type !== 'audio' ? h('button', { class: 'mini', title: 'Как наложение', onclick: (e) => { e.stopPropagation(); addMediaAsOverlay(m); } }, icon('layers', 14)) : null,
          h('button', { class: 'mini danger', title: 'Удалить из проекта', onclick: (e) => { e.stopPropagation(); removeMedia(m.id); } }, icon('trash', 14))
        )
      ),
      h('div', { class: 'media-name' }, m.name)
    );
    card.addEventListener('dblclick', () => {
      if (m.type === 'audio') addMediaToTimeline(m, 'audio');
      else addMediaToTimeline(m, 'main');
    });
    grid.appendChild(card);
  }
  root.appendChild(grid);
  root.appendChild(h('p', { class: 'hint' }, 'Нажмите «+» на файле, чтобы добавить его на таймлайн. Файлы сохраняются в браузере (IndexedDB), проект переживёт перезагрузку.'));
}

/* ---------- ФИЛЬТРЫ ---------- */

function renderFiltersPanel(root) {
  const sel = selectedClip();
  root.appendChild(h('div', { class: 'panel-head' },
    h('h3', {}, 'Фильтры'),
    h('label', { class: 'switch' },
      h('input', {
        type: 'checkbox', checked: state.filterTargetAll,
        onchange: (e) => { state.filterTargetAll = e.target.checked; },
      }),
      h('span', {}, 'на все клипы')
    )
  ));

  const grid = h('div', { class: 'filter-grid' });
  for (const f of FILTERS) {
    const active = sel && !state.filterTargetAll && sel.filter === f.id;
    const card = h('button', {
      class: 'filter-card' + (active ? ' on' : ''),
      title: f.name,
      onclick: () => applyFilter(f.id),
    },
      h('div', {
        class: 'filter-sample',

          filter: f.css || 'none',

        },
      }),

    );
    grid.appendChild(card);
  }

  if (sel && sel.track !== 'text') {
    root.appendChild(h('div', { class: 'section-title' }, 'Коррекция'));

    root.appendChild(sliderRow('Контраст', sel.adj.c, 30, 200, 1, (v) => { sel.adj.c = v; markDirty(); redraw(); }, (v) => v + '%'));
    root.appendChild(sliderRow('Насыщенность', sel.adj.s, 0, 250, 1, (v) => { sel.adj.s = v; markDirty(); redraw(); }, (v) => v + '%'));
  } else {
    root.appendChild(h('p', { class: 'hint' }, 'Выберите клип на таймлайне, чтобы применить фильтр.'));
  }
}

function applyFilter(id) {
  const targets = state.filterTargetAll
    ? state.project.clips.filter((c) => c.track !== 'text')
    : [selectedClip()].filter(Boolean);
  if (!targets.length) return toast('Сначала выберите клип', 'warn');
  commit(() => {
    for (const c of targets) c.filter = id;
  });
  refreshPanel();
}

/* ---------- ПЕРЕХОДЫ ---------- */

function renderTransitionsPanel(root) {
  const sel = selectedClip();
  root.appendChild(h('div', { class: 'panel-head' }, h('h3', {}, 'Переходы')));

  const list = h('div', { class: 'trans-list' });
  for (const t of TRANSITIONS) {
    const active = sel && sel.transition && sel.transition.type === t.id && sel.transition.dur > 0;
    list.appendChild(
      h('button', {
        class: 'trans-card' + (active ? ' on' : ''),
        onclick: () => applyTransition(t.id),
      },
        h('div', { class: 'trans-preview t-' + t.id },
          h('span', { class: 'ta' }), h('span', { class: 'tb' })
        ),
        h('span', {}, t.name)
      )
    );
  }
  root.appendChild(list);

  if (sel && sel.transition && sel.transition.dur > 0) {
    root.appendChild(h('div', { class: 'section-title' }, 'Длительность перехода'));
    root.appendChild(
      sliderRow('', sel.transition.dur, 0.2, 2, 0.05, (v) => {
        sel.transition.dur = round(v, 2);
        markDirty();
        redraw();
      }, (v) => v.toFixed(2) + ' с')
    );
  }
  root.appendChild(h('p', { class: 'hint' }, 'Переход применяется к началу выбранного клипа — нужен предыдущий клип на той же дорожке.'));
}

function applyTransition(id) {
  const clip = selectedClip();
  if (!clip) return toast('Выберите клип на таймлайне', 'warn');
  const t = TRANSITIONS.find((x) => x.id === id);
  commit(() => {
    clip.transition = { type: id, dur: id === 'none' ? 0 : t.dur };
  });
  refreshPanel();
  refreshTimeline();
}

/* ---------- общий helper: строка со слайдером ---------- */

function sliderRow(label, value, min, max, step, onInput, format) {
  const out = h('span', { class: 'srow-val' }, format ? format(value) : String(value));
  const range = h('input', {
    type: 'range', min, max, step, value,
    oninput: (e) => {
      const v = parseFloat(e.target.value);
      out.textContent = format ? format(v) : String(v);
      onInput(v);
    },
  });
  return h('div', { class: 'srow' },
    label ? h('span', { class: 'srow-label' }, label) : null,
    range,
    out
  );
}

/* ---------- добавление текста ---------- */

function addTextClip(preset) {
  const tx = Object.assign(defaultText(), preset && preset.text ? preset.text : {});
  const start = round(state.playhead, 3);
  const clip = makeClip({ track: 'text', start, duration: 3, name: 'Текст', text: tx });
  commit(() => {
    state.project.clips.push(clip);
    state.selection = clip.id;
  });
  setTab('text');
  refreshInspector();
  toast('Текст добавлен', 'ok');
}

/* ===== 09-inspector.js ===== */
/* ============================================================
   09 · Правая панель: инспектор клипа и проекта
   ============================================================ */

function refreshInspector() {
  const root = $('#inspector');
  if (!root) return;
  root.innerHTML = '';
  const clip = selectedClip();
  if (!clip) return renderProjectInspector(root);
  renderClipInspector(root, clip);
}

function field(label, node) {
  return h('div', { class: 'field' }, h('label', {}, label), node);
}

function numInput(value, min, max, step, onInput, suffix) {
  const inp = h('input', {
    type: 'number', class: 'num', value: round(value, 2), min, max, step,
    oninput: (e) => {
      const v = parseFloat(e.target.value);
      if (!isNaN(v)) onInput(clamp(v, min, max));
    },
  });
  return h('div', { class: 'num-wrap' }, inp, suffix ? h('span', { class: 'suffix' }, suffix) : null);
}

function renderClipInspector(root, clip) {
  const media = state.media.get(clip.mediaId);
  const typeName = clip.track === 'text' ? 'Текст' : media ? { video: 'Видео', image: 'Фото', audio: 'Аудио' }[media.type] : 'Клип';

  root.appendChild(
    h('div', { class: 'insp-head' },
      h('div', { class: 'insp-title' },
        h('span', { class: 'badge-t' + (clip.track === 'text' ? ' text' : '') }, typeName),
        h('strong', {}, clipLabel(clip).slice(0, 30))
      ),
      h('button', { class: 'mini danger', title: 'Удалить клип', onclick: deleteSelected }, icon('trash', 15))
    )
  );

  /* --- тайминг --- */
  const timing = h('div', { class: 'grid-2' },
    field('Начало, с', numInput(clip.start, 0, 36000, 0.1, (v) => {
      commit(() => { clip.start = round(v, 3); }, { keepSelection: true });
    })),
    field('Длительность, с', numInput(clip.duration, 0.1, 3600, 0.1, (v) => {
      commit(() => { clip.duration = round(v, 3); }, { keepSelection: true });
    }))
  );
  root.appendChild(timing);

  /* --- текст --- */
  if (clip.track === 'text' && clip.text) {
    const tx = clip.text;
    const ta = h('textarea', {
      class: 'ta', rows: 3, id: 'textContentInput', value: tx.content,
      oninput: (e) => { tx.content = e.target.value; markDirty(); redraw(); refreshTimelineLight(); },
    });
    root.appendChild(h('div', { class: 'section-title' }, 'Содержимое'));
    root.appendChild(ta);

    root.appendChild(h('div', { class: 'grid-2' },
      field('Шрифт', h('select', {
        class: 'sel-input',
        onchange: (e) => { tx.font = e.target.value; markDirty(); redraw(); },
      }, ...FONTS.map((f) => h('option', { value: f.id, selected: tx.font === f.id }, f.name)))),
      field('Насыщенность', h('select', {
        class: 'sel-input',
        onchange: (e) => { tx.weight = parseInt(e.target.value, 10); markDirty(); redraw(); },
      }, ...[400, 600, 700, 800, 900].map((w) => h('option', { value: w, selected: tx.weight === w }, String(w)))))
    ));

    root.appendChild(sliderRow('Размер', tx.size, 16, 260, 1, (v) => { tx.size = v; markDirty(); redraw(); }, (v) => Math.round(v) + ' px'));
    root.appendChild(
      h('div', { class: 'grid-2' },
        field('Цвет', h('input', {
          type: 'color', class: 'color', value: toHex(tx.color),
          oninput: (e) => { tx.color = e.target.value; markDirty(); redraw(); },
        })),
        field('Обводка', h('input', {
          type: 'color', class: 'color', value: toHex(tx.stroke || '#000000'),
          oninput: (e) => { tx.stroke = e.target.value; markDirty(); redraw(); },
        }))

function toHex(color) {
  if (!color) return '#ffffff';
  if (color[0] === '#') return color.length === 7 ? color : '#ffffff';
  const m = color.match(/rgba?\(([^)]+)\)/);
  if (!m) return '#ffffff';
  const [r, g, b] = m[1].split(',').map((x) => parseInt(x, 10));
  const hx = (n) => clamp(n || 0, 0, 255).toString(16).padStart(2, '0');
  return '#' + hx(r) + hx(g) + hx(b);
}

function setSpeed(clip, speed, keepUi) {
  const media = state.media.get(clip.mediaId);
  const maxDur = media && media.duration ? Math.max(0.15, (media.duration - clip.inPoint) / speed) : 3600;
  commit(() => {
    clip.speed = round(speed, 3);
    clip.duration = round(Math.min(clip.duration, maxDur), 3);
  }, { keepSelection: true });
  if (keepUi) {
    /* обновляем только значения без пересборки инспектора */
    refreshTimelineLight();
  }
}

function moveClipToTrack(clip, track) {
  commit(() => {
    clip.track = track;
    if (track === 'overlay') {
      clip.start = round(state.playhead, 3);
      clip.transform.scale = 42;
      clip.transform.x = 0.22;
      clip.transform.y = -0.2;
    } else {
      clip.transform = defaultTransform();
    }
  }, { keepSelection: true });
}

/* ===== 10-actions.js ===== */
/* ============================================================
   10 · Действия с клипами: разделение, удаление, дублирование, буфер
   ============================================================ */

let clipboard = null;

function splitClipAt(clip, t) {
  const local = t - clip.start;
  if (local <= 0.06 || local >= clip.duration - 0.06) return false;
  const right = deepClone(clip);
  right.id = uid('clip');
  right.start = round(clip.start + local, 3);
  right.duration = round(clip.duration - local, 3);
  right.inPoint = round((clip.inPoint || 0) + local * (clip.speed || 1), 3);
  right.transition = { type: 'none', dur: 0 };
  clip.duration = round(local, 3);
  state.project.clips.push(right);
  return true;
}

function splitSelected() {
  const clip = selectedClip();
  const t = state.playhead;
  if (clip && t > clip.start + 0.06 && t < clip.start + clip.duration - 0.06) {
    commit(() => { splitClipAt(clip, t); }, { keepSelection: true });
    toast('Клип разделён', 'ok');
    return;
  }
  /* иначе — режем всё, что под курсором */
  const targets = state.project.clips.filter((c) => t > c.start + 0.06 && t < c.start + c.duration - 0.06);
  if (!targets.length) return toast('Поставьте курсор внутрь клипа', 'warn');
  commit(() => { targets.forEach((c) => splitClipAt(c, t)); });
  toast(`Разделено клипов: ${targets.length}`, 'ok');
}

function deleteSelected() {
  const clip = selectedClip();
  if (!clip) return;
  commit(() => {
    state.project.clips = state.project.clips.filter((c) => c.id !== clip.id);
  }, { keepSelection: false });
  state.selection = null;
  refreshAll();
  toast('Клип удалён');
}

function duplicateSelected() {
  const clip = selectedClip();
  if (!clip) return toast('Выберите клип', 'warn');
  const copy = deepClone(clip);
  copy.id = uid('clip');
  copy.start = round(clip.start + clip.duration, 3);
  copy.transition = { type: 'none', dur: 0 };
  commit(() => {
    state.project.clips.push(copy);
    state.selection = copy.id;
  }, { keepSelection: true });
  refreshAll();
  toast('Клип дублирован', 'ok');
}

function copySelected() {
  const clip = selectedClip();
  if (!clip) return;
  clipboard = deepClone(clip);
  toast('Клип скопирован');
}

function pasteClipboard() {
  if (!clipboard) return toast('Буфер пуст', 'warn');
  const copy = deepClone(clipboard);
  copy.id = uid('clip');
  copy.start = round(state.playhead, 3);
  copy.transition = { type: 'none', dur: 0 };
  commit(() => {
    state.project.clips.push(copy);
    state.selection = copy.id;
  }, { keepSelection: true });
  refreshAll();
  toast('Клип вставлен', 'ok');
}

/* ---------- проект в JSON ---------- */

function exportProjectJson() {
  const payload = {
    app: 'CharonCut',
    version: 1,
    exportedAt: new Date().toISOString(),
    project: state.project,
    media: Array.from(state.media.values()).map((m) => ({
      id: m.id, name: m.name, type: m.type, duration: m.duration,
      width: m.width, height: m.height, size: m.size || 0,
      note: 'Исходные файлы в JSON не вкладываются — перенесите их отдельно',
    })),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  downloadBlob(blob, `${(state.project.name || 'charoncut').replace(/\s+/g, '-')}.json`);
  toast('Файл проекта скачан', 'ok');
}

async function importProjectJson(file) {
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    const proj = data.project || data;
    if (!proj || !Array.isArray(proj.clips)) throw new Error('Неверный формат проекта');
    pushHistory();
    state.project = proj;
    state.selection = null;
    state.playhead = 0;
    stopPlayback();
    refreshAll();
    saveNow();
    const missing = state.project.clips.filter((c) => c.mediaId && !state.media.has(c.mediaId)).length;
    if (missing) toast(`Проект загружен, но для ${missing} клип(ов) нет исходников в этом браузере. Повторное связывание пока не поддерживается`, 'warn', 6000);
    else toast('Проект загружен', 'ok');
  } catch (e) {
    toast('Не удалось открыть проект: ' + e.message, 'err');
  }
}

function selectClip(id) {
  state.selection = id;
  refreshTimelineLight();
  refreshInspector();
  state.needsDraw = true;
}

let exportState = null;

function pickMime() {
  const cands = [
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm',
  ];
  if (!window.MediaRecorder) return '';
  for (const c of cands) {
    try { if (MediaRecorder.isTypeSupported(c)) return c; } catch (e) {}
  }
  return '';
}

function extForMime(mime) {
  if (!mime) return 'webm';
  if (mime.includes('mp4')) return 'mp4';
  return 'webm';
}

function openModal(node, opts = {}) {
  const root = $('#modalRoot');
  root.innerHTML = '';
  const overlay = h('div', { class: 'overlay' }, node);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay && !opts.sticky) closeModal();
  });
  root.appendChild(overlay);
  requestAnimationFrame(() => overlay.classList.add('in'));
  return overlay;
}

function closeModal() {
  const root = $('#modalRoot');
  if (!root) return;
  const ov = root.firstElementChild;
  if (!ov) return;
  ov.classList.remove('in');
  setTimeout(() => { root.innerHTML = ''; }, 150);
}

function openExportDialog() {
  if (state.exporting) return toast('Экспорт уже идёт', 'warn');
  if (projectDuration() <= 0.01) return toast('Проект пуст — нечего экспортировать', 'warn');
  ensureAudio();

  const duration = projectDuration();
  const mime = pickMime();
  if (!window.MediaRecorder || !mime) {
    toast('Этот браузер не умеет записывать видео (MediaRecorder недоступен)', 'err', 6000);
  }

  const quality = { id: 'q-mid', value: 8_000_000 };
  const qualityBtns = [
    { label: 'Черновик', value: 3_000_000 },
    { label: 'Нормально', value: 8_000_000 },
    { label: 'Хорошо', value: 14_000_000 },
    { label: 'Максимум', value: 24_000_000 },
  ];
  const scaleBtns = [
    { label: '100%', value: 1 },
    { label: '75%', value: 0.75 },
    { label: '50%', value: 0.5 },
  ];
  const fpsBtns = [24, 30, 60];
  const opts = { bitrate: 8_000_000, scale: 1, fps: state.project.fps || 30, audio: true };

  const chips = (arr, current, onPick, labelFn) => {
    const wrap = h('div', { class: 'chips' });
    arr.forEach((item) => {
      const val = typeof item === 'object' ? item.value : item;
      const btn = h('button', {
        class: 'chip' + (val === current ? ' on' : ''),
        onclick: () => {
          onPick(val);
          wrap.querySelectorAll('.chip').forEach((b) => b.classList.remove('on'));
          btn.classList.add('on');
        },
      }, labelFn ? labelFn(item) : String(item));
      wrap.appendChild(btn);
    });

  };

  const audioChk = h('input', {
    type: 'checkbox', checked: true,
    onchange: (e) => { opts.audio = e.target.checked; },
  });

  const dialog = h('div', { class: 'modal export-modal' },
    h('div', { class: 'modal-head' },
      h('h2', {}, 'Экспорт видео'),
      h('button', { class: 'mini', onclick: closeModal }, icon('close', 16))
    ),
    h('div', { class: 'modal-body' },
      h('div', { class: 'export-summary' },
        h('div', {}, h('span', { class: 'dim' }, 'Формат'), h('strong', {}, state.project.aspect + ' · ' + state.project.width + '×' + state.project.height)),
        h('div', {}, h('span', { class: 'dim' }, 'Длительность'), h('strong', {}, fmtTime(duration, state.project.fps))),
        h('div', {}, h('span', { class: 'dim' }, 'Файл'), h('strong', {}, (mime || 'webm').includes('mp4') ? 'MP4' : 'WebM'))
      ),
      field('Разрешение', chips(scaleBtns, opts.scale, (v) => { opts.scale = v; }, (i) => `${i.label} · ${Math.round(state.project.width * i.value)}p`)),
      field('Частота кадров', chips(fpsBtns, opts.fps, (v) => { opts.fps = v; }, (i) => i + ' fps')),
      field('Качество', chips(qualityBtns, opts.bitrate, (v) => { opts.bitrate = v; }, (i) => i.label)),
      h('label', { class: 'switch' }, audioChk, h('span', {}, 'Со звуком (микс дорожек)')),
      h('p', { class: 'hint' }, 'Экспорт идёт в реальном времени: ролик на ' + fmtDur(duration) + ' будет сохраняться примерно столько же. Не переключайте вкладку — браузер может замедлить отрисовку.'),
      mime ? null : h('p', { class: 'hint err' }, 'MediaRecorder недоступен: используйте Chrome, Edge, Firefox или Safari 15+.')
    ),
    h('div', { class: 'modal-foot' },
      h('button', { class: 'btn ghost', onclick: () => { closeModal(); saveFrame(); } }, icon('image', 15), 'Сохранить кадр (PNG)'),
      h('div', { class: 'spacer' }),
      h('button', { class: 'btn', onclick: closeModal }, 'Отмена'),
      h('button', {

        onclick: () => startExport(opts),

    )
